<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
<defs>
  <!-- Dramatic sky gradient: deep crimson → amber → gold at horizon -->
  <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d0508"/>
    <stop offset="25%" stop-color="#1a0808"/>
    <stop offset="55%" stop-color="#4a1205"/>
    <stop offset="75%" stop-color="#8b2e05"/>
    <stop offset="90%" stop-color="#c45a0a"/>
    <stop offset="100%" stop-color="#e8820a"/>
  </linearGradient>
  <!-- Sun glow -->
  <radialGradient id="hsun" cx="68%" cy="78%" r="28%">
    <stop offset="0%" stop-color="#fff5a0" stop-opacity="1"/>
    <stop offset="15%" stop-color="#f5c842" stop-opacity="0.9"/>
    <stop offset="40%" stop-color="#e8820a" stop-opacity="0.6"/>
    <stop offset="70%" stop-color="#c45a0a" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#4a1205" stop-opacity="0"/>
  </radialGradient>
  <!-- Horizon haze -->
  <linearGradient id="hhaze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8820a" stop-opacity="0"/>
    <stop offset="50%" stop-color="#d4600a" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#8b3005" stop-opacity="0.5"/>
  </linearGradient>
  <!-- Field gradient -->
  <linearGradient id="hfield" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3d2005"/>
    <stop offset="100%" stop-color="#1a0d02"/>
  </linearGradient>
  <!-- Light ray gradient -->
  <linearGradient id="hray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f5c842" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
  </linearGradient>
  <filter id="hblur"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="hblur2"><feGaussianBlur stdDeviation="2"/></filter>
</defs>

<!-- Sky base -->
<rect width="1200" height="500" fill="url(#hsky)"/>

<!-- Sun disc -->
<circle cx="820" cy="390" r="55" fill="#fff5a0" opacity="0.95" filter="url(#hblur2)"/>
<circle cx="820" cy="390" r="45" fill="#fff8b8" opacity="1"/>

<!-- Sun glow spread -->
<rect width="1200" height="500" fill="url(#hsun)"/>

<!-- Light rays fanning out from sun -->
<g opacity="0.06" fill="#f5d070">
  <polygon points="820,390 420,0 580,0"/>
  <polygon points="820,390 600,0 700,0"/>
  <polygon points="820,390 700,0 800,0"/>
  <polygon points="820,390 900,0 1000,0"/>
  <polygon points="820,390 1000,0 1100,0"/>
  <polygon points="820,390 200,0 350,0"/>
</g>

<!-- Distant mountain silhouette - hazy, far -->
<ellipse cx="300" cy="350" rx="380" ry="120" fill="#1a0808" opacity="0.55"/>
<ellipse cx="700" cy="365" rx="420" ry="100" fill="#1a0808" opacity="0.45"/>
<ellipse cx="1050" cy="355" rx="300" ry="110" fill="#1a0808" opacity="0.5"/>

<!-- Atmospheric haze layer -->
<rect x="0" y="300" width="1200" height="100" fill="url(#hhaze)"/>

<!-- Mid-ground rolling field silhouette -->
<path d="M 0 420 Q 100 400 200 415 Q 300 430 400 408 Q 500 390 600 405 Q 700 420 800 402 Q 900 385 1000 400 Q 1100 415 1200 405 L 1200 500 L 0 500 Z" fill="#0d0505"/>

<!-- Silhouetted tree line left -->
<g fill="#0a0303">
  <rect x="30" y="355" width="8" height="65"/>
  <ellipse cx="34" cy="348" rx="22" ry="28"/>
  <rect x="65" y="362" width="6" height="58"/>
  <ellipse cx="68" cy="354" rx="18" ry="24"/>
  <rect x="100" y="350" width="10" height="70"/>
  <ellipse cx="105" cy="340" rx="28" ry="34"/>
  <rect x="145" y="360" width="7" height="60"/>
  <ellipse cx="148" cy="352" rx="20" ry="26"/>
  <rect x="178" y="365" width="6" height="55"/>
  <ellipse cx="181" cy="357" rx="16" ry="22"/>
</g>

<!-- Silhouetted tree line right -->
<g fill="#0a0303">
  <rect x="1020" y="352" width="9" height="68"/>
  <ellipse cx="1024" cy="342" rx="25" ry="32"/>
  <rect x="1058" y="360" width="7" height="60"/>
  <ellipse cx="1061" cy="351" rx="20" ry="27"/>
  <rect x="1090" y="355" width="8" height="65"/>
  <ellipse cx="1094" cy="344" rx="23" ry="30"/>
  <rect x="1125" y="362" width="6" height="58"/>
  <ellipse cx="1128" cy="354" rx="17" ry="22"/>
  <rect x="1155" y="358" width="8" height="62"/>
  <ellipse cx="1159" cy="347" rx="21" ry="28"/>
</g>

<!-- Wheat/crop stalks silhouette - warm golden -->
<g stroke="#c87820" stroke-width="1.2" fill="none" opacity="0.7">
  <!-- Left cluster -->
  <line x1="250" y1="500" x2="246" y2="430"/><line x1="246" y1="430" x2="240" y2="410"/><line x1="246" y1="430" x2="252" y2="412"/>
  <line x1="246" y1="445" x2="238" y2="428"/><line x1="246" y1="445" x2="255" y2="430"/>
  <line x1="268" y1="500" x2="264" y2="428"/><line x1="264" y1="428" x2="258" y2="408"/><line x1="264" y1="428" x2="270" y2="410"/>
  <line x1="285" y1="500" x2="282" y2="432"/><line x1="282" y1="432" x2="276" y2="412"/><line x1="282" y1="432" x2="288" y2="414"/>
  <line x1="303" y1="500" x2="300" y2="426"/><line x1="300" y1="426" x2="294" y2="406"/><line x1="300" y1="426" x2="306" y2="408"/>
  <line x1="320" y1="500" x2="317" y2="430"/><line x1="317" y1="430" x2="311" y2="410"/><line x1="317" y1="430" x2="323" y2="412"/>
  <line x1="338" y1="500" x2="335" y2="428"/><line x1="335" y1="428" x2="329" y2="408"/><line x1="335" y1="428" x2="341" y2="410"/>
  <!-- Right cluster -->
  <line x1="860" y1="500" x2="857" y2="428"/><line x1="857" y1="428" x2="851" y2="408"/><line x1="857" y1="428" x2="863" y2="410"/>
  <line x1="878" y1="500" x2="875" y2="432"/><line x1="875" y1="432" x2="869" y2="412"/><line x1="875" y1="432" x2="881" y2="414"/>
  <line x1="895" y1="500" x2="892" y2="426"/><line x1="892" y1="426" x2="886" y2="406"/><line x1="892" y1="426" x2="898" y2="408"/>
  <line x1="913" y1="500" x2="910" y2="430"/><line x1="910" y1="430" x2="904" y2="410"/><line x1="910" y1="430" x2="916" y2="412"/>
  <line x1="930" y1="500" x2="927" y2="428"/><line x1="927" y1="428" x2="921" y2="408"/><line x1="927" y1="428" x2="933" y2="410"/>
</g>

<!-- Farm hut/barn silhouette center -->
<g fill="#080202">
  <rect x="550" y="390" width="100" height="40"/>
  <polygon points="540,390 600,360 660,390"/>
  <rect x="575" y="400" width="18" height="30"/>
  <rect x="605" y="395" width="22" height="12"/>
</g>

<!-- Birds in sky -->
<g stroke="#0a0303" stroke-width="1.5" fill="none" opacity="0.7">
  <path d="M 480 180 Q 488 174 496 180"/>
  <path d="M 510 165 Q 518 159 526 165"/>
  <path d="M 540 175 Q 548 169 556 175"/>
  <path d="M 460 200 Q 467 194 474 200"/>
  <path d="M 700 145 Q 708 139 716 145"/>
  <path d="M 728 155 Q 736 149 744 155"/>
</g>

<!-- Stars -->
<g fill="#f5d98a" opacity="0.5">
  <circle cx="100" cy="60" r="1.5"/><circle cx="180" cy="35" r="1"/><circle cx="320" cy="80" r="1.5"/>
  <circle cx="420" cy="45" r="1"/><circle cx="550" cy="70" r="2"/><circle cx="650" cy="30" r="1"/>
  <circle cx="760" cy="55" r="1.5"/><circle cx="880" cy="25" r="1"/><circle cx="990" cy="65" r="1.5"/>
  <circle cx="1080" cy="40" r="1"/><circle cx="1150" cy="75" r="2"/>
</g>

<!-- Golden reflection on foreground -->
<rect x="0" y="440" width="1200" height="60" fill="#e8820a" opacity="0.08"/>
</svg>