<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
<defs>
  <linearGradient id="vbg" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#071a0e"/>
    <stop offset="40%" stop-color="#0d2a15"/>
    <stop offset="100%" stop-color="#061208"/>
  </linearGradient>
  <radialGradient id="vspot" cx="35%" cy="40%" r="45%">
    <stop offset="0%" stop-color="#2a6a35" stop-opacity="0.45"/>
    <stop offset="60%" stop-color="#1a4a20" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#071a0e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vspot2" cx="80%" cy="70%" r="35%">
    <stop offset="0%" stop-color="#1a5a28" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#071a0e" stop-opacity="0"/>
  </radialGradient>
  <filter id="vglow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="vsoft"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="vblur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>

<!-- Background -->
<rect width="1200" height="500" fill="url(#vbg)"/>
<rect width="1200" height="500" fill="url(#vspot)"/>
<rect width="1200" height="500" fill="url(#vspot2)"/>

<!-- Textured stone/slate surface hint -->
<g opacity="0.04" stroke="#6ab870" stroke-width="0.5" fill="none">
  <line x1="0" y1="100" x2="1200" y2="120"/><line x1="0" y1="200" x2="1200" y2="218"/>
  <line x1="0" y1="300" x2="1200" y2="315"/><line x1="0" y1="400" x2="1200" y2="412"/>
</g>

<!-- BIG leaf — left, diagonal sweep -->
<g transform="translate(0,80)" opacity="0.55">
  <path d="M -20 400 Q 80 200 280 120 Q 200 200 120 350 Z" fill="#1a5a25"/>
  <!-- Veins -->
  <path d="M -20 400 Q 80 200 280 120" stroke="#2a7a35" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 20 370 Q 90 270 220 180" stroke="#2a7a35" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M 60 340 Q 120 260 200 210" stroke="#2a7a35" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M 90 310 Q 145 250 185 225" stroke="#2a7a35" stroke-width="0.6" fill="none" opacity="0.35"/>
</g>

<!-- BIG leaf — right, opposite diagonal -->
<g transform="translate(1200,420) rotate(180)" opacity="0.5">
  <path d="M -20 400 Q 80 200 300 100 Q 200 200 110 360 Z" fill="#155020"/>
  <path d="M -20 400 Q 80 200 300 100" stroke="#1f7030" stroke-width="1.5" fill="none" opacity="0.7"/>
</g>

<!-- Medium leaf top right -->
<g transform="translate(950, 0)" opacity="0.45">
  <path d="M 200 0 Q 100 80 20 200 Q 80 120 160 50 Z" fill="#1a5a25"/>
  <path d="M 200 0 Q 100 80 20 200" stroke="#2a7a35" stroke-width="1.2" fill="none" opacity="0.6"/>
</g>

<!-- Large fresh tomato — center left, glowing red -->
<g transform="translate(380, 240)" filter="url(#vglow)">
  <circle cx="0" cy="0" r="58" fill="#c01818" opacity="0.9"/>
  <circle cx="0" cy="0" r="55" fill="#d42020"/>
  <!-- Highlight -->
  <ellipse cx="-18" cy="-20" rx="16" ry="10" fill="#ff6060" opacity="0.4"/>
  <ellipse cx="-12" cy="-14" rx="7" ry="4" fill="#ffaaaa" opacity="0.6"/>
  <!-- Stem -->
  <rect x="-3" y="-62" width="6" height="14" fill="#3a7a20" rx="3"/>
  <!-- Leaves at top -->
  <path d="M 0 -55 Q -18 -70 -24 -52 Q -10 -50 0 -55 Z" fill="#4a9a28"/>
  <path d="M 0 -55 Q 18 -70 24 -52 Q 10 -50 0 -55 Z" fill="#3a8820"/>
  <path d="M 0 -55 Q -8 -75 0 -72 Q 8 -75 0 -55 Z" fill="#4a9a28"/>
  <!-- Shadow -->
  <ellipse cx="0" cy="65" rx="55" ry="14" fill="#030d06" opacity="0.6"/>
</g>

<!-- Fresh eggplant/brinjal — right of tomato -->
<g transform="translate(560, 255)">
  <!-- Shadow -->
  <ellipse cx="0" cy="60" rx="28" ry="9" fill="#030d06" opacity="0.55"/>
  <!-- Body -->
  <ellipse cx="0" cy="0" rx="22" ry="50" fill="#2a0a5a"/>
  <ellipse cx="0" cy="5" rx="20" ry="46" fill="#38108a"/>
  <!-- Highlight -->
  <ellipse cx="-8" cy="-20" rx="6" ry="14" fill="#8050d0" opacity="0.4"/>
  <!-- Green cap -->
  <path d="M 0 -48 Q -15 -62 -18 -50 Q -8 -45 0 -48 Z" fill="#3a8820"/>
  <path d="M 0 -48 Q 15 -62 18 -50 Q 8 -45 0 -48 Z" fill="#4a9a28"/>
  <path d="M 0 -48 Q -5 -68 0 -65 Q 5 -68 0 -48 Z" fill="#3a8820"/>
  <rect x="-2" y="-58" width="4" height="12" fill="#3a7a18" rx="2"/>
</g>

<!-- Carrot — diagonal, far right -->
<g transform="translate(750, 280) rotate(-35)">
  <ellipse cx="0" cy="55" rx="8" ry="9" fill="#030d06" opacity="0.4"/>
  <path d="M -14 -50 Q -16 30 0 70 Q 16 30 14 -50 Z" fill="#d45a05"/>
  <path d="M -12 -50 Q -14 30 0 68 Q 10 20 10 -50 Z" fill="#e8720a"/>
  <!-- Highlight -->
  <ellipse cx="-5" cy="-20" rx="4" ry="20" fill="#f09040" opacity="0.4"/>
  <!-- Horizontal lines (carrot texture) -->
  <g stroke="#c04800" stroke-width="0.7" opacity="0.4">
    <line x1="-13" y1="-30" x2="12" y2="-30"/>
    <line x1="-14" y1="-10" x2="13" y2="-10"/>
    <line x1="-14" y1="10" x2="13" y2="10"/>
    <line x1="-13" y1="30" x2="11" y2="30"/>
    <line x1="-10" y1="48" x2="9" y2="48"/>
  </g>
  <!-- Leafy top -->
  <g stroke="#3a8820" stroke-width="1.5" fill="none">
    <path d="M 0 -52 Q -15 -80 -10 -95 Q -2 -75 0 -52"/>
    <path d="M 0 -52 Q 12 -82 8 -96 Q 1 -75 0 -52"/>
    <path d="M 0 -52 Q -8 -88 0 -98 Q 8 -88 0 -52"/>
    <path d="M 0 -52 Q -22 -70 -20 -85 Q -8 -65 0 -52"/>
  </g>
</g>

<!-- Okra/ladies finger — far left, leaning -->
<g transform="translate(160, 230) rotate(20)">
  <ellipse cx="0" cy="55" rx="6" ry="7" fill="#030d06" opacity="0.35"/>
  <path d="M -7 -60 Q -9 10 -4 70 Q 0 75 4 70 Q 9 10 7 -60 Q 2 -72 -7 -60 Z" fill="#3a8820"/>
  <path d="M -6 -55 Q -8 10 -3 65 Q 2 60 6 -55 Z" fill="#4a9a28"/>
  <!-- Ridges -->
  <g stroke="#2a6a18" stroke-width="0.6" opacity="0.5">
    <line x1="-7" y1="-40" x2="-7" y2="50"/>
    <line x1="0" y1="-65" x2="0" y2="55"/>
    <line x1="7" y1="-40" x2="7" y2="50"/>
  </g>
  <!-- Tip star -->
  <path d="M 0 -66 Q -8 -80 -5 -90 Q 0 -82 5 -90 Q 8 -80 0 -66 Z" fill="#5ab030"/>
</g>

<!-- Cabbage / leafy green - background right -->
<g transform="translate(900, 300)" opacity="0.7">
  <ellipse cx="0" cy="0" rx="70" ry="55" fill="#1a4a15"/>
  <ellipse cx="0" cy="0" rx="58" ry="45" fill="#205a18"/>
  <ellipse cx="0" cy="0" rx="45" ry="35" fill="#2a6a20"/>
  <ellipse cx="0" cy="0" rx="32" ry="25" fill="#358025"/>
  <!-- Highlight -->
  <ellipse cx="-15" cy="-15" rx="18" ry="12" fill="#40a030" opacity="0.3"/>
  <ellipse cx="-10" cy="60" rx="65" ry="15" fill="#030d06" opacity="0.5"/>
</g>

<!-- Dew drops scattered -->
<g opacity="0.7">
  <ellipse cx="220" cy="310" rx="4" ry="6" fill="#c2dfd1" filter="url(#vsoft)"/>
  <ellipse cx="470" cy="180" rx="3" ry="5" fill="#c2dfd1" filter="url(#vsoft)"/>
  <ellipse cx="680" cy="350" rx="4" ry="6" fill="#c2dfd1" filter="url(#vsoft)"/>
  <ellipse cx="850" cy="200" rx="3" ry="5" fill="#c2dfd1" filter="url(#vsoft)"/>
  <ellipse cx="1050" cy="380" rx="4" ry="6" fill="#c2dfd1" filter="url(#vsoft)"/>
  <!-- Drop shadows -->
  <ellipse cx="220" cy="316" rx="4" ry="2" fill="#0a2a10" opacity="0.4"/>
  <ellipse cx="470" cy="186" rx="3" ry="1.5" fill="#0a2a10" opacity="0.4"/>
  <ellipse cx="680" cy="356" rx="4" ry="2" fill="#0a2a10" opacity="0.4"/>
</g>

<!-- Subtle soil/ground texture at bottom -->
<path d="M 0 430 Q 300 415 600 428 Q 900 440 1200 420 L 1200 500 L 0 500 Z" fill="#050e06" opacity="0.8"/>

<!-- Dramatic top light beam (like a window / spotlight) -->
<rect x="0" y="0" width="1200" height="160" fill="url(#vspot)" opacity="0.3"/>
<path d="M 300 0 L 700 0 L 800 500 L 200 500 Z" fill="#2a6a35" opacity="0.04"/>
</svg>